<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141613" />
    <script>
      (() => {
        let theme;
        try {
          const saved = localStorage.getItem("replens.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        if (!theme) {
          theme = window.matchMedia?.("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#141613" : "#f5f6f2",
        );
      })();
    </script>
    <meta
      name="description"
      content="RepLens: live feedback for two-arm dumbbell curls."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <title>RepLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
