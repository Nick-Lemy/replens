services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: replens
      POSTGRES_USER: replens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replens -d replens"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    image: replens-api:${DEPLOY_VERSION:-local}
    build:
      context: ../../..
      dockerfile: web/backend/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${FRONTEND_ORIGIN:?}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGIN:?}
      TRUSTED_PROXY_CIDRS: ${CADDY_EDGE_IP:-172.29.240.2}/32
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TRACKING_ASSET_DIR: /models/mediapipe/1.1.1
    volumes:
      - ${TRACKING_ASSET_HOST_PATH:-../../../models/mediapipe/1.1.1}:/models/mediapipe/1.1.1:ro
    networks:
      edge:
        ipv4_address: ${API_EDGE_IP:-172.29.240.3}
      data: {}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  migrate:
    image: replens-migrate:${DEPLOY_VERSION:-local}
    build:
      context: ../../..
      dockerfile: web/backend/Dockerfile
      target: migration
    profiles: ["ops"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${FRONTEND_ORIGIN:?}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGIN:?}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTP_HOST_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_HOST_PORT:-443}:443"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_HOST_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_EDGE_IP:-172.29.240.2}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.29.240.0/24}
  data:
    internal: true
