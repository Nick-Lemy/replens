services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: replens
      POSTGRES_USER: replens
    ports:
      - '127.0.0.1:55434:5432'
    volumes:
      - replens_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U replens -d replens']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  replens_dev_postgres:
